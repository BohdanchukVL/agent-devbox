name: Deploy to Hetzner

on:
  workflow_dispatch:
    inputs:
      location:
        description: Datacenter location
        required: true
        type: choice
        default: nbg1
        options: [nbg1, fsn1, hel1]
      server_type:
        description: Machine size
        required: true
        type: choice
        default: cx33
        options: [cx23, cx33, cx43, cx53, cpx32, cpx42, cpx52]
      disk_size:
        description: Size in GB for dedicated /workspace volume (0 = keep on root disk)
        required: true
        default: "80"
      install_docker:
        description: Install Docker
        type: boolean
        default: true
      install_codex:
        description: Install Codex CLI
        type: boolean
        default: true
      install_claude:
        description: Install Claude Code
        type: boolean
        default: true
      install_opencode:
        description: Install OpenCode
        type: boolean
        default: false
      install_antigravity:
        description: Install Google Antigravity CLI (agy)
        type: boolean
        default: true
      install_browser:
        description: Install headless browser (Playwright/Chromium) for web testing
        type: boolean
        default: true
      ssh_allowed_cidrs:
        description: Comma-separated CIDRs allowed for SSH fallback (e.g. 203.0.113.50/32). Recommended when Tailscale is used.
        required: false
        default: ""
      backups:
        description: Enable Hetzner automatic server backups
        type: boolean
        default: true
      agent_sandbox_strict:
        description: Enable strict unprivileged sandbox for Claude Code and Codex
        type: boolean
        default: true
      release_channel:
        description: Toolchain release channel ('stable' pins versions, 'latest' uses unpinned)
        type: choice
        default: stable
        options: [stable, latest]

concurrency: hetzner-devbox

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    uses: ./.github/workflows/_deploy.yml
    with:
      cloud: hetzner
      backups: ${{ inputs.backups }}
      location: ${{ inputs.location }}
      server_type: ${{ inputs.server_type }}
      disk_size: ${{ inputs.disk_size }}
      install_docker: ${{ inputs.install_docker }}
      install_codex: ${{ inputs.install_codex }}
      install_claude: ${{ inputs.install_claude }}
      install_opencode: ${{ inputs.install_opencode }}
      install_antigravity: ${{ inputs.install_antigravity }}
      install_browser: ${{ inputs.install_browser }}
      ssh_allowed_cidrs: ${{ inputs.ssh_allowed_cidrs }}
      agent_sandbox_strict: ${{ inputs.agent_sandbox_strict }}
      release_channel: ${{ inputs.release_channel }}
    secrets: inherit
