name: Deploy to Azure

on:
  workflow_dispatch:
    inputs:
      location:
        description: Azure region
        required: true
        type: choice
        default: westeurope
        options: [westeurope, northeurope, eastus, eastus2, westus2, centralus]
      vm_size:
        description: Machine size
        required: true
        type: choice
        default: Standard_D2s_v5
        options:
          - Standard_B2s
          - Standard_D2s_v5
          - Standard_D4s_v5
          - Standard_D8s_v5
      disk_size:
        description: OS disk size in GB
        required: true
        default: "80"
      install_docker:
        description: Install Docker
        type: boolean
        default: true
      install_codex:
        description: Install Codex CLI
        type: boolean
        default: true
      install_claude:
        description: Install Claude Code
        type: boolean
        default: true
      install_opencode:
        description: Install OpenCode
        type: boolean
        default: false
      install_antigravity:
        description: Install Google Antigravity CLI (agy)
        type: boolean
        default: true
      install_browser:
        description: Install headless browser (Playwright/Chromium) for web testing
        type: boolean
        default: true
      ssh_allowed_cidrs:
        description: Comma-separated CIDRs allowed for SSH fallback (e.g. 203.0.113.50/32). Recommended when Tailscale is used.
        required: false
        default: ""

concurrency: azure-devbox

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/_deploy.yml
    with:
      cloud: azure
      location: ${{ inputs.location }}
      server_type: ${{ inputs.vm_size }}
      disk_size: ${{ inputs.disk_size }}
      install_docker: ${{ inputs.install_docker }}
      install_codex: ${{ inputs.install_codex }}
      install_claude: ${{ inputs.install_claude }}
      install_opencode: ${{ inputs.install_opencode }}
      install_antigravity: ${{ inputs.install_antigravity }}
      install_browser: ${{ inputs.install_browser }}
      ssh_allowed_cidrs: ${{ inputs.ssh_allowed_cidrs }}
    secrets: inherit
