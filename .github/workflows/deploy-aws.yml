name: Deploy to AWS

on:
  workflow_dispatch:
    inputs:
      region:
        description: Region
        required: true
        type: choice
        default: eu-central-1
        options: [eu-central-1, eu-west-1, us-east-1, us-west-2]
      instance_type:
        description: Machine size
        required: true
        type: choice
        default: t3.medium
        options: [t3.small, t3.medium, t3.large, t3.xlarge]
      disk_size:
        description: Root disk size in GB
        required: true
        default: "80"
      install_docker:
        description: Install Docker
        type: boolean
        default: true
      install_codex:
        description: Install Codex CLI
        type: boolean
        default: true
      install_claude:
        description: Install Claude Code
        type: boolean
        default: true
      install_opencode:
        description: Install OpenCode
        type: boolean
        default: false
      install_antigravity:
        description: Install Google Antigravity CLI (agy)
        type: boolean
        default: true
      install_browser:
        description: Install headless browser (Playwright/Chromium) for web testing
        type: boolean
        default: true
      ssh_allowed_cidrs:
        description: Comma-separated CIDRs allowed for SSH fallback (e.g. 203.0.113.50/32). Recommended when Tailscale is used.
        required: false
        default: ""

concurrency: aws-devbox

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/_deploy.yml
    with:
      cloud: aws
      location: ${{ inputs.region }}
      server_type: ${{ inputs.instance_type }}
      disk_size: ${{ inputs.disk_size }}
      install_docker: ${{ inputs.install_docker }}
      install_codex: ${{ inputs.install_codex }}
      install_claude: ${{ inputs.install_claude }}
      install_opencode: ${{ inputs.install_opencode }}
      install_antigravity: ${{ inputs.install_antigravity }}
      install_browser: ${{ inputs.install_browser }}
      ssh_allowed_cidrs: ${{ inputs.ssh_allowed_cidrs }}
    secrets: inherit
