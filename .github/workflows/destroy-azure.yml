name: Destroy Azure environment

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "destroy" to confirm deleting all Azure resources
        required: true

concurrency: azure-devbox

permissions:
  id-token: write
  contents: read

jobs:
  destroy:
    uses: ./.github/workflows/_destroy.yml
    with:
      cloud: azure
      confirm: ${{ inputs.confirm }}
    secrets: inherit
