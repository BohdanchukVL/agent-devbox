name: Destroy Hetzner environment

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "destroy" to confirm deleting the server AND the workspace volume
        required: true

concurrency: hetzner-devbox

permissions:
  contents: read
  id-token: write

jobs:
  destroy:
    uses: ./.github/workflows/_destroy.yml
    with:
      cloud: hetzner
      confirm: ${{ inputs.confirm }}
    secrets: inherit
