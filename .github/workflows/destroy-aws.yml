name: Destroy AWS environment

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "destroy" to confirm deleting all AWS resources
        required: true
      region:
        description: Region where the devbox is deployed
        required: true
        type: choice
        default: eu-central-1
        options: [eu-central-1, eu-west-1, us-east-1, us-west-2]

concurrency: aws-devbox

permissions:
  id-token: write
  contents: read

jobs:
  destroy:
    uses: ./.github/workflows/_destroy.yml
    with:
      cloud: aws
      location: ${{ inputs.region }}
      confirm: ${{ inputs.confirm }}
    secrets: inherit
