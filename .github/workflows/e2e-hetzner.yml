name: E2E Hetzner

on:
  workflow_dispatch:
  schedule:
    # Weekly on Sunday at 04:00 UTC
    - cron: '0 4 * * 0'

concurrency: e2e-hetzner

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    uses: ./.github/workflows/_deploy.yml
    with:
      cloud: hetzner
      location: nbg1
      server_type: cx22
      disk_size: "0"
      name_prefix: agent-devbox-e2e-${{ github.run_id }}
      state_key: e2e/${{ github.run_id }}/terraform.tfstate
    secrets: inherit

  destroy:
    if: always()
    needs: deploy
    uses: ./.github/workflows/_destroy.yml
    with:
      cloud: hetzner
      confirm: destroy
      state_key: e2e/${{ github.run_id }}/terraform.tfstate
    secrets: inherit
