name: E2E Hetzner

on:
  workflow_dispatch:
    inputs:
      release_channel:
        description: Toolchain release channel to test
        required: true
        type: choice
        default: stable
        options: [stable, latest]
  schedule:
    # Weekly on Sunday at 04:00 UTC (tests stable pinned channel)
    - cron: '0 4 * * 0'
    # Monthly on 1st at 06:00 UTC (tests latest unpinned channel)
    - cron: '0 6 1 * *'

concurrency: e2e-hetzner

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    uses: ./.github/workflows/_deploy.yml
    with:
      cloud: hetzner
      location: nbg1
      server_type: cx23
      disk_size: "0"
      name_prefix: agent-devbox-e2e-${{ github.run_id }}
      state_key: e2e/${{ github.run_id }}/terraform.tfstate
      release_channel: ${{ github.event_name == 'schedule' && (github.event.schedule == '0 6 1 * *' && 'latest' || 'stable') || inputs.release_channel || 'stable' }}
    secrets: inherit

  destroy:
    if: always()
    needs: deploy
    uses: ./.github/workflows/_destroy.yml
    with:
      cloud: hetzner
      confirm: destroy
      state_key: e2e/${{ github.run_id }}/terraform.tfstate
    secrets: inherit
