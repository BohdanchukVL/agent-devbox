#cloud-config
# Shared provisioning for all providers. Rendered by Terraform templatefile();
# the install scripts are injected verbatim from provisioning/*.sh so the
# resulting machine is identical on every cloud.

hostname: agent-devbox
ssh_pwauth: false
package_update: true

users:
  - name: ${username}
    shell: /bin/bash
    groups: [sudo]
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    lock_passwd: true
    ssh_authorized_keys:
      - ${ssh_public_key}

write_files:
  - path: /etc/devbox/devbox.env
    permissions: "0644"
    content: |
      DEVBOX_USER=${username}
      INSTALL_DOCKER=${install_docker}
      INSTALL_CODEX=${install_codex}
      INSTALL_CLAUDE=${install_claude}
      INSTALL_OPENCODE=${install_opencode}
      INSTALL_ANTIGRAVITY=${install_antigravity}
      INSTALL_BROWSER=${install_browser}
      WORKSPACE_DEVICE=${workspace_device}
  - path: /opt/devbox/install-base.sh
    permissions: "0755"
    content: |
      ${indent(6, install_base)}
  - path: /opt/devbox/install-agents.sh
    permissions: "0755"
    content: |
      ${indent(6, install_agents)}
  - path: /opt/devbox/install-browser.sh
    permissions: "0755"
    content: |
      ${indent(6, browser)}
  - path: /opt/devbox/install-shell.sh
    permissions: "0755"
    content: |
      ${indent(6, install_shell)}
  - path: /opt/devbox/zshrc
    permissions: "0644"
    content: |
      ${indent(6, zshrc)}
  - path: /opt/devbox/motd.sh
    permissions: "0755"
    content: |
      ${indent(6, motd)}
  - path: /opt/devbox/tmux.conf
    permissions: "0644"
    content: |
      ${indent(6, tmux_conf)}
  - path: /opt/devbox/tmux-status.sh
    permissions: "0755"
    content: |
      ${indent(6, tmux_status)}
  - path: /opt/devbox/osc7.sh
    permissions: "0644"
    content: |
      ${indent(6, osc7)}

runcmd:
  - /opt/devbox/install-base.sh >> /var/log/devbox-install.log 2>&1
  - /opt/devbox/install-agents.sh >> /var/log/devbox-install.log 2>&1
  - /opt/devbox/install-browser.sh >> /var/log/devbox-install.log 2>&1
  - /opt/devbox/install-shell.sh >> /var/log/devbox-install.log 2>&1
  - install -m 0755 /opt/devbox/motd.sh /etc/update-motd.d/99-devbox
  - install -m 0644 -o ${username} -g ${username} /opt/devbox/tmux.conf /home/${username}/.tmux.conf
  - install -D -m 0755 -o ${username} -g ${username} /opt/devbox/tmux-status.sh /home/${username}/.devbox/bin/tmux-status
  - grep -q devbox-osc7 /etc/bash.bashrc || echo '[ -f /opt/devbox/osc7.sh ] && . /opt/devbox/osc7.sh # devbox-osc7' >> /etc/bash.bashrc
  - chmod -x /etc/update-motd.d/10-help-text /etc/update-motd.d/50-motd-news || true
  - touch /etc/devbox/.provisioned
