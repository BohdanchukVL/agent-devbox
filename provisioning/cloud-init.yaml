#cloud-config
# Agent Devbox thin cloud-init bootstrap.
# Renders a minimal cloud-config that writes /etc/devbox/devbox.env (0600)
# and runs /opt/devbox/bootstrap.sh to pull and execute provisioning scripts.

hostname: agent-devbox
ssh_pwauth: false
package_update: true
packages:
  - curl
  - tar
  - ca-certificates

users:
  - name: ${username}
    shell: /bin/bash
    groups: [sudo]
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    lock_passwd: true
    ssh_authorized_keys:
      - ${ssh_public_key}

write_files:
  - path: /etc/devbox/devbox.env
    permissions: "0600"
    content: |
      DEVBOX_USER="${username}"
      INSTALL_DOCKER="${install_docker}"
      INSTALL_CODEX="${install_codex}"
      INSTALL_CLAUDE="${install_claude}"
      INSTALL_OPENCODE="${install_opencode}"
      INSTALL_ANTIGRAVITY="${install_antigravity}"
      INSTALL_BROWSER="${install_browser}"
      WORKSPACE_DEVICE="${workspace_device}"
      TAILSCALE_AUTHKEY="${tailscale_authkey}"
      DEVBOX_WEB_TOKEN="${web_token}"
      PROVISIONING_REPO="${git_repo}"
      PROVISIONING_REF="${git_ref}"
      PROVISIONING_TOKEN="${git_token}"
      PROVISIONING_SHA256="${git_sha256}"
      PROVISIONING_TARBALL_URL="${tarball_url}"
  - path: /opt/devbox/bootstrap.sh
    permissions: "0755"
    content: |
      ${indent(6, bootstrap_script)}

runcmd:
  - /opt/devbox/bootstrap.sh >> /var/log/devbox-install.log 2>&1
