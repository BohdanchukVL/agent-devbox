# Agent devbox — persistent agent sessions with a git/load status bar.

set  -g  default-terminal "tmux-256color"
set  -ga terminal-overrides ",*256col*:Tc"
set  -as terminal-features ",*:256:RGB"
set  -g  set-clipboard on          # OSC 52 copy → devbox → your local clipboard
set  -g  allow-passthrough on      # pass through OSC 7 (cwd) and escapes to client
set  -as terminal-features '*:osc7'
set  -g  mouse on

# ── Mouse & Selection Behavior ──────────────────────────────────────────────
# At active prompt (scroll_position == 0): copy & exit copy mode (ready to type).
# Scrolled up in history (scroll_position > 0): copy & clear selection, stay in place (no jump).
bind-key -T copy-mode    MouseDragEnd1Pane if-shell -F "#{>:#{scroll_position},0}" "send-keys -X copy-selection" "send-keys -X copy-selection-and-cancel"
bind-key -T copy-mode-vi MouseDragEnd1Pane if-shell -F "#{>:#{scroll_position},0}" "send-keys -X copy-selection" "send-keys -X copy-selection-and-cancel"

# Scrolling down: if selecting, continue selection down; if just browsing history, exit copy mode at bottom
bind-key -T copy-mode    WheelDownPane select-pane \; if-shell -F "#{selection_present}" "send-keys -X -N 5 scroll-down" "send-keys -X -N 5 scroll-down-and-cancel"
bind-key -T copy-mode-vi WheelDownPane select-pane \; if-shell -F "#{selection_present}" "send-keys -X -N 5 scroll-down" "send-keys -X -N 5 scroll-down-and-cancel"

# Single click in copy mode clears selection without jumping or exiting copy mode
bind-key -T copy-mode    MouseDown1Pane select-pane \; send-keys -X clear-selection
bind-key -T copy-mode-vi MouseDown1Pane select-pane \; send-keys -X clear-selection

# Double-click (word) and Triple-click (line) copy cleanly based on scroll position
bind-key -T copy-mode    DoubleClick1Pane select-pane \; send-keys -X select-word \; if-shell -F "#{>:#{scroll_position},0}" "send-keys -X copy-selection" "send-keys -X copy-selection-and-cancel"
bind-key -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word \; if-shell -F "#{>:#{scroll_position},0}" "send-keys -X copy-selection" "send-keys -X copy-selection-and-cancel"
bind-key -T copy-mode    TripleClick1Pane select-pane \; send-keys -X select-line \; if-shell -F "#{>:#{scroll_position},0}" "send-keys -X copy-selection" "send-keys -X copy-selection-and-cancel"
bind-key -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line \; if-shell -F "#{>:#{scroll_position},0}" "send-keys -X copy-selection" "send-keys -X copy-selection-and-cancel"

bind-key -T root         DoubleClick1Pane select-pane -t = \; if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" "send-keys -M" "copy-mode -H ; send-keys -X select-word ; send-keys -X copy-selection-and-cancel"
bind-key -T root         TripleClick1Pane select-pane -t = \; if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" "send-keys -M" "copy-mode -H ; send-keys -X select-line ; send-keys -X copy-selection-and-cancel"
set  -g  history-limit 50000
set  -g  base-index 1
setw -g  pane-base-index 1
set  -sg escape-time 10
set  -g  focus-events on
set  -g  renumber-windows on

# use zsh for new panes when present — no server restart needed (agents survive)
if-shell '[ -x /usr/bin/zsh ]' 'set -g default-shell /usr/bin/zsh'

# splits/new window keep the current directory; | and - as intuitive aliases
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window   -c "#{pane_current_path}"

# ── status bar ────────────────────────────────────────────────────────────
set -g status on
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=colour235,fg=colour250"

# refresh status bar immediately upon switching windows or panes
set-hook -g after-select-window 'refresh-client -S'
set-hook -g after-select-pane   'refresh-client -S'

set -g status-left-length 20
set -g status-left "#[bg=colour30,fg=colour231,bold] devbox #[bg=colour235,fg=colour238] "

# tab label = index:working-dir (basename), not the running process name
set -g window-status-format "#I:#{b:pane_current_path}"
set -g window-status-current-format "#[bg=colour238,fg=colour231,bold] #I:#{b:pane_current_path} #[bg=colour235,fg=colour238]"
set -g window-status-separator "  "

# Right side: single call to tmux-status all (cwd · git · ai · load · time)
set -g status-right-length 180
set -g status-right "#($HOME/.devbox/bin/tmux-status all '#{pane_current_path}' '#{pane_current_command}' '#{pane_pid}' '#{window_id}') "

set -g message-style "bg=colour30,fg=colour231"
set -g pane-active-border-style "fg=colour30"
set -g pane-border-style "fg=colour238"
