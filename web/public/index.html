<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#141414">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Agent Devbox</title>
  
  <link rel="stylesheet" href="/vendor/xterm/css/xterm.css" onerror="loadCdnCss(this)">
  <link rel="stylesheet" href="/styles/theme.css">
  <link rel="stylesheet" href="/styles/layout.css">
  <link rel="stylesheet" href="/styles/mobile.css">

  <script>
    function loadCdnCss(el) {
      el.integrity = 'sha384-8Xk9wy/gzEDUKrXtrmCFa2bBuK3BpjpDuL/p0SeKQX19Khl/M+lHOgD/CyYf7efP';
      el.crossOrigin = 'anonymous';
      el.href = 'https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css';
    }
    function loadCdnXterm() {
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.js';
      s.integrity = 'sha384-M169f14mRZOXm3hD/v2Ti0ThIT/RnAQagXA9nlE15yHAtrW19gdePJh/HaTzUOe/';
      s.crossOrigin = 'anonymous';
      document.head.appendChild(s);
    }
    function loadCdnFit() {
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.js';
      s.integrity = 'sha384-iF+jqbuti4XlB64clWgFWYEscb+UnSRv3VgVikGYZu+otNFnSHr7y7NcKfBnGizn';
      s.crossOrigin = 'anonymous';
      document.head.appendChild(s);
    }
    function loadCdnWebgl() {
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/@xterm/addon-webgl@0.18.0/lib/addon-webgl.js';
      s.integrity = 'sha384-AkzdQDeATxpW8V7I2EPcwg17qAoLQMjEFHb//1QaAAIyIlbDAHGKno5+huH7RKxq';
      s.crossOrigin = 'anonymous';
      document.head.appendChild(s);
    }
  </script>
</head>
<body>

  <div id="app">
    <!-- Top Bar -->
    <header class="app-header">
      <div class="header-left">
        <span class="status-dot" id="status-dot" title="Підключення..."></span>
        <span class="brand-badge">devbox</span>
        <span class="project-name" id="project-name">main</span>
      </div>
      <div class="header-right">
        <button type="button" class="btn-header" id="btn-panes" title="Список панелей">⊞ Панелі</button>
      </div>
    </header>

    <!-- Subheader: Active Pane & Control Pill -->
    <div class="app-subheader">
      <div class="pane-indicator">
        <span>Панель:</span>
        <span class="pane-title" id="pane-label">Термінал</span>
      </div>
      <div class="control-status-group">
        <span class="control-pill observer" id="control-pill">👁️ Перегляд (ноутбук)</span>
        <button type="button" class="btn-control-toggle" id="btn-control-toggle">Керувати з телефона</button>
      </div>
    </div>

    <!-- Terminal Container -->
    <div id="terminal-container">
      <div id="terminal"></div>
      <div id="drop-overlay">
        <svg width="48" height="48" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path>
        </svg>
        <span>Перетягніть файли сюди для завантаження</span>
      </div>
    </div>

    <!-- Multiline Prompt Composer Dock -->
    <div id="composer-dock"></div>

    <!-- Quick Action Dock -->
    <div id="quick-dock">
      <button type="button" class="dock-btn primary" id="dock-composer" title="Ввести запит або команду">✍️ Промпт</button>
      <button type="button" class="dock-btn primary" id="dock-photo" title="Сфотографувати або прикріпити фото">📷 Фото</button>
      <button type="button" class="dock-btn primary" id="dock-file" title="Прикріпити файл">📎 Файл</button>
      <button type="button" class="dock-btn" id="dock-zoom" title="Збільшити активну панель для всіх">🔍 Zoom</button>
      <button type="button" class="dock-btn" id="dock-esc" title="Escape">Esc</button>
      <button type="button" class="dock-btn" id="dock-tab" title="Tab">Tab</button>
      <button type="button" class="dock-btn" id="dock-ctrl" title="Ctrl modifier">Ctrl</button>
      <button type="button" class="dock-btn danger" id="dock-break" title="Ctrl-C (Break)">^C</button>
      <button type="button" class="dock-btn" id="dock-up" title="Вгору">▲</button>
      <button type="button" class="dock-btn" id="dock-down" title="Вниз">▼</button>
      <button type="button" class="dock-btn" id="dock-slash" title="Slash">/</button>
      <button type="button" class="dock-btn" id="dock-enter" title="Enter">↵</button>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toast"></div>

  <!-- Load XTerm Scripts with CDN fallback and Subresource Integrity (SRI) -->
  <script src="/vendor/xterm/lib/xterm.js" onerror="loadCdnXterm()"></script>
  <script src="/vendor/addon-fit/lib/addon-fit.js" onerror="loadCdnFit()"></script>
  <script src="/vendor/addon-webgl/lib/addon-webgl.js" onerror="loadCdnWebgl()"></script>

  <!-- Modular Application Entry -->
  <script type="module" src="/app/main.js"></script>
</body>
</html>
